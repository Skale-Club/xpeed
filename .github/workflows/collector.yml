# Builds and tests the Windows collector (Rust). Runs only when the collector or its file spec changes.
# It is separate from CI on purpose: the Coolify deploy waits for "CI" only, and the collector is not part of the app image.
name: Collector

on:
  pull_request:
    paths:
      - "collector/**"
      - ".github/workflows/collector.yml"
      - "docs/telemetria-virtual-2026-11-10/FORMATO-DE-VOLTA.md"
  push:
    branches: [main]
    paths:
      - "collector/**"
      - ".github/workflows/collector.yml"

concurrency:
  group: collector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collector:
    # Windows: the reader uses named memory mappings and events, and its tests create their own.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup component add clippy rustfmt
          rustc --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            collector/target
          key: collector-${{ runner.os }}-${{ hashFiles('collector/Cargo.lock') }}
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
