name: Android APK

# Builds the signed Android app (Capacitor) and publishes it at fixed links:
# https://github.com/Skale-Club/xpeed/releases/download/android-latest/xpeed.apk       (bundled web app)
# https://github.com/Skale-Club/xpeed/releases/download/android-latest/xpeed-live.apk  (loads xpeed.skale.club)
on:
  push:
    branches: [main, feat/android-app]
  workflow_dispatch:

permissions:
  contents: write

# One build at a time across branches: pushing the same commit to main and the
# feature branch would otherwise upload to the same release at once and collide.
concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the native-change check below compares with older commits.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: Copy web app into the Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Restore signing key
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/xpeed-release.p12"

      - name: Build signed APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/xpeed-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Collect offline APK
        run: cp android/app/build/outputs/apk/release/app-release.apk xpeed-offline.apk

      # Second variant: the app loads the production site instead of the bundled
      # copy, so web changes reach phones without reinstalling (capacitor.config.ts).
      - name: Point the app at the live site
        run: npx cap sync android
        env:
          CAP_SERVER_URL: https://xpeed.skale.club

      - name: Build signed live-site APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/xpeed-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      # The default download: loads the deployed site, so every web deploy reaches
      # phones without reinstalling. Only native changes need a new APK.
      - name: Collect live-site APK (default)
        run: cp android/app/build/outputs/apk/release/app-release.apk xpeed.apk

      - uses: actions/upload-artifact@v4
        with:
          name: xpeed-apk-${{ github.run_number }}
          path: |
            xpeed.apk
            xpeed-offline.apk

      - name: Publish to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # "Native build" = the last build whose native side changed (Android project,
          # Capacitor config or plugins). The live-site app only asks to update when it
          # is older than that; web changes reach it without a new APK.
          run=${{ github.run_number }}
          prev=$(gh release view android-latest --json body -q .body 2>/dev/null || true)
          native_run=$(echo "$prev" | grep -oE 'Native build [0-9]+' | grep -oE '[0-9]+' || true)
          native_sha=$(echo "$prev" | grep -oE 'Native build [0-9]+ @ [0-9a-f]+' | grep -oE '[0-9a-f]+$' || true)
          changed=yes
          if [ -n "$native_sha" ] && git cat-file -e "$native_sha^{commit}" 2>/dev/null; then
            changed=no
            git diff --quiet "$native_sha" HEAD -- android capacitor.config.ts || changed=yes
            if git diff "$native_sha" HEAD -- package.json | grep -q '@capacitor'; then changed=yes; fi
          fi
          if [ "$changed" = yes ]; then native_run=$run; native_sha=${GITHUB_SHA::7}; fi
          notes="Build $run from ${{ github.ref_name }} @ ${GITHUB_SHA::7}. Native build $native_run @ $native_sha. Install on Android: open this link on the phone and allow installing from the browser."
          if ! gh release view android-latest >/dev/null 2>&1; then
            gh release create android-latest --prerelease --title "Xpeed Android (latest)" --notes "$notes" --target "$GITHUB_SHA"
          else
            gh release edit android-latest --notes "$notes"
          fi
          gh release upload android-latest xpeed.apk xpeed-offline.apk --clobber
          # Old name of the live-site APK, now xpeed.apk.
          gh release delete-asset android-latest xpeed-live.apk -y 2>/dev/null || true
