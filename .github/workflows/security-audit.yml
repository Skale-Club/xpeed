# S10-1: SCA gate. Fails the build on production-reachable HIGH/critical npm
# advisories. Dev/build-only moderates (esbuild/vite dev-server) are excluded
# via --omit=dev so they don't block shipping.
name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies (fail on high+)
        run: npm audit --omit=dev --audit-level=high
