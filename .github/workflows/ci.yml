# Checks that run before anything is deployed. Vercel deploys from main on its
# own, so keep this green (or make the tsc / eslint steps blocking once their
# known errors are fixed).
name: CI

on:
  pull_request:
  push:
    branches: [main, "feat/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci

      # Non-blocking for now: tsconfig.app.json is not strict and a handful of
      # pre-existing type errors remain (recharts value types, csv-parser).
      # Remove continue-on-error once `npx tsc --noEmit -p tsconfig.app.json` is clean.
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json
        continue-on-error: true

      # src/ currently has 0 lint errors (12 warnings), so this one blocks.
      - name: Lint
        run: npx eslint src

      - name: Unit tests
        run: npx vitest run
        env:
          # Some modules create the Supabase client on import; tests never reach it.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

      - name: Production build
        run: npm run build
        env:
          # Dummy values: the build only needs them to exist (vite.config.ts fails
          # the production build without them). Nothing here is a real key.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
