# Checks required by the Coolify deployment workflow before publishing main.
name: CI

on:
  pull_request:
  push:
    branches: [main, "feat/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run
        env:
          # Some modules create the Supabase client on import; tests never reach it.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

      - name: Google Cloud auth policy tests
        run: npm run test:auth-cloud

      - name: Production build
        run: npm run build
        env:
          # Dummy values: the build only needs them to exist (vite.config.ts fails
          # the production build without them). Nothing here is a real key.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          VITE_GOOGLE_CLIENT_ID: ci-placeholder

      - name: Container HTTP contracts
        run: npm run test:http

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.6"
      - name: Edge Function type checks and contract tests
        run: npm run check:edge

      - name: Install isolated SQL test runtime
        run: npm install --prefix node_modules/.xpeed-audit-tools --no-save --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.13
      - name: PostgreSQL migrations, atomic saves and access policies
        run: npm run test:sql
