[package]
name = "xpeed-sim"
version = "0.19.0"
edition = "2021"
description = "Reads racing-game telemetry on Windows and writes it as Xpeed lap files."
publish = false

# The program people see is named Xpeed Companion; the package name stays the internal identifier.
[[bin]]
name = "xpeed-companion"
path = "src/main.rs"

[dependencies]
flate2 = "1"
# The phone view's picture of the panel (pure Rust, no other dependency).
jpeg-encoder = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
ureq = { version = "3", default-features = false, features = ["native-tls"] }

[build-dependencies]
# Reads the site's shared menu and words (`shared/design/nav.json`, `src/locales/*.json`) into the panel at build time.
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Memory",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_System_Console",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_Storage_FileSystem",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_GdiPlus",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# The site's own pages inside the panel (WebView2). Its loader is linked in statically, so no DLL ships beside the program. It
# brings the `windows` crate (the COM types its API speaks); everything else here stays on `windows-sys`.
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com"] }

[profile.release]
opt-level = 3
lto = true
strip = true

[dev-dependencies]
# Only to compare the drawn icon with the official PNG of the app.
png = "0.18"
