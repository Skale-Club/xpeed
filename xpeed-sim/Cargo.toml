[package]
name = "xpeed-sim"
version = "0.1.0"
edition = "2021"
description = "Reads racing-game telemetry on Windows and writes it as Xpeed lap files."
publish = false

[dependencies]
flate2 = "1"
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["native-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_Storage_FileSystem",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_GdiPlus",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
strip = true

[dev-dependencies]
# Only to compare the drawn icon with the official PNG of the app.
png = "0.18"
