project_id = "drqmrddxlrlbqnydumjm"

# Public endpoints called by external clients (Claude.ai MCP connector) that do
# NOT carry a Supabase JWT — they authenticate themselves inside the function
# (OAuth 2.1 tokens / API keys). They MUST keep verify_jwt = false, otherwise the
# Edge gateway rejects every request with UNAUTHORIZED_NO_AUTH_HEADER before our
# code runs. Keeping this in config.toml ensures redeploys never reset it.
[functions.xpeed-oauth]
verify_jwt = false

[functions.xpeed-mcp]
verify_jwt = false

[functions.car-insights-mcp]
verify_jwt = false

[functions.mcp-server]
verify_jwt = false

# Google ID tokens are verified by PostgREST in current_app_user_id().
# Legacy Edge JWT verification only understands Supabase-issued tokens.
[functions.chat]
verify_jwt = false

[functions.analyze-session]
verify_jwt = false

[functions.ai-health]
verify_jwt = false

# Configure the actual Xpot Google project in the hosted dashboard's
# Authentication > Third-Party Auth > Firebase, before deploying the SPA.

[functions.manage-mcp-tokens]
verify_jwt = false

[auth.third_party.firebase]
enabled = true
project_id = "skaleclub"

[functions.read-fuel-receipt]
verify_jwt = false
